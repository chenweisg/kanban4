# Deploy the static Kanban app (index.html) to GitHub Pages on every push to main.
# Pages serves the gh-pages branch; this job copies index.html there.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Publish site pages to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/site
          cp index.html index-v2.html /tmp/site/
          git fetch origin gh-pages
          git switch gh-pages
          cp /tmp/site/*.html .
          touch .nojekyll
          git add index.html index-v2.html .nojekyll
          if git diff --cached --quiet; then
            echo "Site already up to date."
          else
            git commit -m "Deploy ${GITHUB_SHA::7} from main"
            git push origin gh-pages
          fi
